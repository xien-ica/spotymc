name: Build librespot binaries

# This workflow is the "equivalent origin" for the librespot binaries shipped by SpotyMC.
# It builds librespot from a pinned upstream commit/tag, on GitHub-hosted runners, from a
# workflow file that is public and auditable. Anyone (including a Modrinth reviewer) can:
#   1. See exactly which upstream commit was built (LIBRESPOT_REF below).
#   2. Re-run this workflow themselves and diff the resulting SHA-256 checksums.
#   3. Read the full build log for every artifact in the Actions tab.
#
# Trigger: push a tag like "librespot-v0.6.0-build1" to cut a new release of binaries.

on:
  push:
    tags:
      - "librespot-*"
  workflow_dispatch: {}

env:
  # Pin this to an exact upstream commit SHA (preferred) or tag. Never track a branch head.
  LIBRESPOT_REPO: "https://github.com/librespot-org/librespot.git"
  # v0.6.0 hit a Spotify-side backend change that broke content resolution for every librespot
  # client ("Track should be available, but no alternatives found" / tracks reported "not
  # available" for everything) -- tracked upstream as librespot-org/librespot#1527, fixed in
  # v0.7.0. Pinned to v0.8.0 (latest stable as of this writing) rather than v0.7.0 exactly, since
  # it includes that fix plus everything else merged since.
  LIBRESPOT_REF: "v0.8.0"   # <-- update deliberately; every change here is a reviewable diff

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-latest migrated to Visual Studio 2026 ("18.x") in June 2026. The old cmake
          # crate pulled in transitively by aws-lc-sys (a rustls dependency) doesn't recognize
          # that version string and panics with "unsupported or unknown VisualStudio version:
          # 18.0". Pinning to windows-2022 keeps the VS 2022 toolchain these crates understand.
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact_name: librespot.exe
            asset_name: librespot-windows-x86_64.exe

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: librespot
            asset_name: librespot-linux-x86_64

          - os: macos-15-intel  # Intel runner
            target: x86_64-apple-darwin
            artifact_name: librespot
            asset_name: librespot-macos-x86_64

          - os: macos-14        # Apple Silicon runner
            target: aarch64-apple-darwin
            artifact_name: librespot
            asset_name: librespot-macos-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout librespot at pinned ref
        uses: actions/checkout@v4
        with:
          repository: librespot-org/librespot
          ref: ${{ env.LIBRESPOT_REF }}
          path: librespot-src

      - name: Record exact commit built
        shell: bash
        run: |
          cd librespot-src
          echo "Building librespot @ $(git rev-parse HEAD)"
          git rev-parse HEAD > ../built-commit-${{ matrix.target }}.txt

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # aws-lc-sys (pulled in via rustls) mis-detects the compiler on Windows without a properly
      # initialized MSVC environment, and ends up passing GCC-style flags (e.g. -Wno-unused-parameter)
      # to cl.exe, which rejects them with "D8021: invalid numeric argument". This sets up vcvars
      # correctly before the build runs.
      - name: Setup MSVC environment (Windows only)
        if: matrix.os == 'windows-2022'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Git for Windows bundles its own link.exe (in Git\usr\bin), which shadows MSVC's linker on
      # GitHub's Windows runners and gets invoked instead of the real one. NOTE: this can't be fixed
      # by writing a filtered PATH to $GITHUB_ENV from a separate step -- GitHub Actions explicitly
      # does not support setting PATH that way (only $GITHUB_PATH is honored for PATH, and it only
      # supports prepending, not removing entries). So the filtering has to happen in the SAME step
      # that runs cargo, which is why "Build" below is split into a Windows-specific branch.
      - name: Install NASM (Windows only)
        if: matrix.os == 'windows-2022'
        uses: ilammy/setup-nasm@v1

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y build-essential libasound2-dev

      - name: Build (release, locked deps) [Windows]
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch '\\Git\\usr\\bin' }) -join ';'
          cd librespot-src
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (release, locked deps) [non-Windows]
        if: matrix.os != 'windows-2022'
        shell: bash
        run: |
          cd librespot-src
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "librespot-src/target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" \
             "dist/${{ matrix.asset_name }}"

      - name: Checksum
        shell: bash
        run: |
          cd dist
          # macOS doesn't ship sha256sum by default (only shasum -a 256); Linux/Windows-Git-Bash do.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"
          fi
          cat "${{ matrix.asset_name }}.sha256"

      - name: Upload build artifact (for PR / manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            dist/${{ matrix.asset_name }}
            dist/${{ matrix.asset_name }}.sha256
            built-commit-${{ matrix.target }}.txt

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/librespot-')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.asset_name }}
            dist/${{ matrix.asset_name }}.sha256
          body: |
            Built from ${{ env.LIBRESPOT_REPO }} @ ${{ env.LIBRESPOT_REF }}
            by this repository's public build-librespot.yml workflow (run: ${{ github.run_id }}).

  # Combines every per-platform checksum into one signed-looking manifest so reviewers
  # (and the installer's checksum verification) have a single file to check against.
  manifest:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/librespot-')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Build combined SHA256SUMS
        run: |
          find artifacts -name "*.sha256" -exec cat {} \; | sort > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: SHA256SUMS.txt
